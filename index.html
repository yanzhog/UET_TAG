<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UET-demo</title>
    
    <!-- Bing UET Tracking Script -->
    <script>
        (function(w, d, t, u, o) {
            w[u] = w[u] || [];
            o.ts = (new Date()).getTime();
            var n = d.createElement(t);
            n.src = "https://bat.bing.net/bat.js?ti=" + o.ti + ("uetq" != u ? "&q=" + u : "");
            n.async = true;
            d.head.appendChild(n);
        })(window, document, 'script', 'uetq', {ti: '187260045'});
    </script>

    <!-- Netlify Hosting Meta -->
    <meta name="hosting-provider" content="Netlify">
    <meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&utm_source=meta&utm_medium=referral&utm_id=4d50707f-8a22-493c-a01d-b60c6e7d2cb7">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        h1 {
            margin-top: 40px;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <!-- Title -->
    <h1>UET-demo</h1>

    <!-- Action Button -->
    <button class="btn" onclick="GetCustomEvent()">Purchase</button>

    <!-- Main Script -->
    <script>
        // Get revenue value function
        function GetRevenueValue() {
            // Return a sample revenue value - modify as needed
            return 6;
        }

        // Custom event handling function
        function GetCustomEvent() {
            window.uetq = window.uetq || [];
            
            // Track purchase event with Bing UET
            window.uetq.push('event', 'purchase', {
                'revenue_value': GetRevenueValue(),
                'currency': 'USD'
            });
        }
    </script>
</body>

</html>
