<!-- 下面第一排显示按钮，点击触发 GetCustomEvent() -->
<button class="btn" onclick="GetCustomEvent()">Button 1</button>

<script>
    // Get revenue value function
    function GetRevenueValue() {
        // Return a sample revenue value - modify as needed
        return 6;
    }

    // Custom event handling function
    function GetCustomEvent() {
        window.uetq = window.uetq || [];
        window.uetq.push('event', 'purchase', {'revenue_value': GetRevenueValue(), 'currency': 'USD'});
        console.log('Button 1 clicked: GetCustomEvent() triggered.');

    }
</script>
